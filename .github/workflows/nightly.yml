name: Nightly Regression

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  test:
    name: Full Regression Suite
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: develop
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    # First, update snapshots to ensure they exist in the CI environment
    - name: Update visual test snapshots
      run: npx playwright test --project=visual-tests --update-snapshots
      env:
        CI: true
        BASE_URL: https://www.saucedemo.com
    
    # Then run all tests including the visual tests with the updated snapshots
    - name: Run tests across all browsers
      run: npx playwright test
      env:
        CI: true
        BASE_URL: https://www.saucedemo.com
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
